<header class="register-header">
    <div class="container">
        <div class="logo">
            <i class="bi bi-shop"></i>
            <span>MercadoLiebre</span>
        </div>

        <button class="btn btn-link">
            Ayuda
        </button>
    </div>
</header>

<main>
    <div class="container">

        <div class="register-card">

            <h1>Publicar producto</h1>

            <p class="subtitle">
                Completa la información para publicar un nuevo producto.
            </p>

            <form (ngSubmit)="registerProduct()">

                <!-- Categoría -->
                <div class="mb-3">

                    <label class="form-label">
                        Categoría
                    </label>

                    <select
                        class="form-select"
                        [(ngModel)]="categoryId"
                        name="categoryId"
                        required>

                        <option [ngValue]="''" disabled>
                            Selecciona una categoría
                        </option>

                        <option
                            *ngFor="let category of categories"
                            [value]="category.id">

                            {{ category.name }}

                        </option>

                    </select>

                </div>

                <!-- Nombre -->
                <div class="mb-3">

                    <label class="form-label">
                        Nombre del producto
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="name"
                        name="name"
                        placeholder="Ej. Laptop Lenovo ThinkPad"
                        required>

                </div>

                <!-- Marca -->
                <div class="mb-3">

                    <label class="form-label">
                        Marca
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        [(ngModel)]="brand"
                        name="brand"
                        placeholder="Ej. Lenovo"
                        required>

                </div>

                <!-- Descripción -->
                <div class="mb-3">

                    <label class="form-label">
                        Descripción
                    </label>

                    <textarea
                        class="form-control"
                        rows="5"
                        [(ngModel)]="description"
                        name="description"
                        placeholder="Describe tu producto..."
                        required>
                    </textarea>

                </div>

                <!-- Precio -->
                <div class="mb-4">

                    <label class="form-label">
                        Precio
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            $
                        </span>

                        <input
                            type="number"
                            class="form-control"
                            [(ngModel)]="price"
                            name="price"
                            min="1"
                            placeholder="0"
                            required>

                    </div>

                </div>

                <!-- Stock -->
                <div class="mb-4">

                    <label class="form-label">
                        Stock disponible
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        [(ngModel)]="stock"
                        name="stock"
                        min="0"
                        placeholder="Cantidad disponible"
                        required>

                    <div class="form-text">
                        Indica la cantidad de unidades disponibles para la venta.
                    </div>

                </div>

                <!-- Imagen -->
                <div class="mb-4">

                    <label class="form-label">
                        Imagen del producto
                    </label>

                    <input
                        type="file"
                        class="form-control"
                        accept="image/*"
                        (change)="onImageSelected($event)">

                    <div
                        *ngIf="imagePreview"
                        class="image-preview mt-3">

                        <img
                            [src]="imagePreview"
                            alt="Vista previa del producto"
                            class="img-fluid rounded shadow">

                    </div>

                    <div class="form-text">
                        Formatos permitidos: JPG, PNG o WEBP.
                    </div>

                </div>

                <!-- Botón -->
                <button
                    type="submit"
                    class="btn btn-success w-100">

                    <i class="bi bi-plus-circle me-2"></i>
                    Publicar producto

                </button>

            </form>

        </div>

    </div>
</main>
