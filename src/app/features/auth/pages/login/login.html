<header class="login-header">
    <div class="container">
        <div
        class="logo"
        (click)="goToHome()">
            <i class="bi bi-shop"></i>
            <span>MercadoLiebre</span>
        </div>

        <div class="header-actions">

            <button
                class="btn btn-link"
                (click)="goToHome()">

                Inicio

            </button>

            <button
                class="btn btn-link">

                Ayuda

            </button>

        </div>
    </div>
</header>

<main>
    <div class="container">

        <div class="login-card">

            <h2>Iniciar sesión</h2>

            <p class="subtitle">
                Ingresa tus credenciales para continuar.
            </p>

            <form (ngSubmit)="login()">

                <!-- Correo -->
                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        [(ngModel)]="email"
                        name="email"
                        id="email"
                        class="form-control"
                        placeholder="correo@ejemplo.com">

                </div>

                <!-- Contraseña -->
                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-container">

                        <input
                            [type]="showPassword ? 'text' : 'password'"
                            [(ngModel)]="password"
                            name="password"
                            id="password"
                            class="form-control"
                            placeholder="Contraseña">

                        <button
                            type="button"
                            class="toggle-password"
                            (click)="togglePassword()">

                            <i
                                class="bi"
                                [class.bi-eye]="!showPassword"
                                [class.bi-eye-slash]="showPassword">
                            </i>

                        </button>

                    </div>

                </div>

                <!-- Botón iniciar sesión -->
                <button
                    type="submit"
                    class="btn btn-primary login-button">

                    Iniciar sesión

                </button>

                <!-- Recuperar contraseña -->
                <div class="forgot-password">

                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>

                <!-- Separador -->
                <div class="divider">
                    <span>o</span>
                </div>

                <!-- Registro -->
                <p class="register-text">
                    ¿No tienes una cuenta?
                </p>

                <button
                    type="button"
                    class="btn btn-outline-primary register-button"
                    (click)="goToRegister()">

                    Crear cuenta

                </button>

            </form>

        </div>

    </div>
</main>
