<header class="profile-header">

    <div class="container">

        <div class="logo" (click)="goToHome()">
            <i class="bi bi-shop"></i>
            <span>MercadoLiebre</span>
        </div>

        <div class="header-links">

            <button
                class="btn btn-link"
                (click)="goToHome()">
                Inicio
            </button>

            <button class="btn btn-link">
                Ayuda
            </button>

        </div>

    </div>

</header>

<main>

    <div class="container">

        <div class="profile-card">

            <h2>Mi cuenta</h2>

            <p class="subtitle">
                Administra la información de tu perfil.
            </p>

            <form>

                <!-- Nombre -->

                <div class="form-group">

                    <label for="fullName">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        class="form-control"
                        [(ngModel)]="fullName"
                        name="fullName"
                        placeholder="Nombre completo">

                </div>

                <!-- Correo -->

                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        [(ngModel)]="email"
                        name="email"
                        placeholder="correo@ejemplo.com">

                </div>

                <!-- Contraseña -->

                <div class="form-group">

                    <label for="password">
                        Nueva contraseña
                    </label>

                    <div class="password-container">

                        <input
                            [type]="showPassword ? 'text' : 'password'"
                            id="password"
                            class="form-control"
                            [(ngModel)]="password"
                            name="password"
                            placeholder="Dejar vacío para no cambiar">

                        <button
                            type="button"
                            class="toggle-password"
                            (click)="togglePassword()">

                            <i
                                class="bi"
                                [class.bi-eye]="!showPassword"
                                [class.bi-eye-slash]="showPassword">
                            </i>

                        </button>

                    </div>

                </div>

                <!-- Botones -->

                <div class="button-group">

                    <button
                        type="button"
                        class="btn btn-primary"
                        (click)="saveChanges()">

                        Guardar cambios

                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        (click)="resetChanges()">

                        Deshacer cambios

                    </button>

                </div>

            </form>

        </div>

    </div>

</main>
